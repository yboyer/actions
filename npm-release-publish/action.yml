name: Publish npm release
description: Tag, publish, and create a GitHub release for the package version in package.json.

inputs:
  npm-access:
    description: npm package access used during publication.
    required: false
    default: public

outputs:
  version:
    description: Package version read from package.json.
    value: ${{ steps.version.outputs.version }}
  tag:
    description: Release tag derived from the package version.
    value: ${{ steps.version.outputs.tag }}
  published:
    description: Whether a new version was published.
    value: ${{ steps.version.outputs.should_publish }}

runs:
  using: composite
  steps:
    - id: version
      name: Create version tag
      shell: bash
      run: |
        VERSION="$(node -p "require('./package.json').version")"
        TAG="v${VERSION}"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
          echo "Tag $TAG already exists; skipping publication."
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"
        echo "should_publish=true" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.version.outputs.should_publish == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

    - name: Publish package
      if: steps.version.outputs.should_publish == 'true'
      shell: bash
      run: npm publish --provenance --access "${{ inputs.npm-access }}"

