name: Semantic release
description: Run semantic-release using the repository configuration and expose the created tag.

inputs:
  extra-packages:
    description: Additional npm packages, one package spec per line.
    required: false
    default: ''

outputs:
  tag:
    description: Git tag created by semantic-release, or an empty string when no release is needed.
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - id: release
      name: Run semantic-release
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        export LC_ALL=C
        tags_before=$(mktemp)
        trap 'rm -f "$tags_before"' EXIT
        git tag --list | sort > "$tags_before"
        packages=(
          --package=semantic-release@26.0.1
          --package=@yboyer/semantic-release-config@1.0.0
        )
        while IFS= read -r package; do
          if [[ -n "$package" ]]; then
            packages+=("--package=$package")
          fi
        done <<< "$EXTRA_PACKAGES"
        npx --yes "${packages[@]}" -c '
          set -e
          config_path=node_modules/@yboyer/semantic-release-config
          if [ ! -e "$config_path" ] && [ ! -L "$config_path" ]; then
            mkdir -p "$(dirname "$config_path")"
            ln -s "$(dirname "$(command -v semantic-release)")/../@yboyer/semantic-release-config" "$config_path"
            trap "rm -f \"$config_path\"" EXIT
          fi
          semantic-release
        '
        tag=$(comm -13 "$tags_before" <(git tag --list | sort))
        if [[ "$tag" == *$'\n'* ]]; then
          echo "Expected at most one new release tag." >&2
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
