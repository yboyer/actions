name: Docker publish
description: Build, tag, and publish a Docker image to GHCR.

inputs:
  image:
    description: Fully qualified image name, for example ghcr.io/owner/image.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  secrets:
    description: BuildKit secrets, one id=value entry per line.
    required: false
  build-args:
    description: Docker build arguments, one key=value entry per line.
    required: false

runs:
  using: composite
  steps:
    - name: Generate Docker image metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ${{ inputs.image }}
        tags: |
          type=semver,pattern={{raw}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        secrets: ${{ inputs.secrets }}
        build-args: ${{ inputs.build-args }}
